<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearMe | Community Feed</title>
    <link rel="stylesheet" href="community-feeds.css">
    <link rel="stylesheet" href="/user/user-shared.css">
    <link rel="stylesheet" href="responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <header class="navbar">
        <button id="mobileMenuBtn" class="mobile-menu-btn">
            <i data-lucide="menu"></i>
        </button>
        <h1 class="logo">HearMe</h1>
        <div class="user-profile-section">
            <div class="user-profile-trigger">
                <div class="user-badge">User</div>
                <div class="user-avatar">A</div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <nav class="sidebar">
            <a href="/user/community" class="nav-item active"><i data-lucide="home"></i><span>Feed</span></a>
            <a href="/user/groups" class="nav-item"><i data-lucide="users"></i><span>Groups</span></a>
            <a href="/user/chat" class="nav-item"><i data-lucide="message-square"></i><span>Venting-Space</span></a>
            <a href="/user/experts" class="nav-item"><i data-lucide="user-plus"></i><span>Experts</span></a>
            <a href="/user/sos" class="nav-item"><i data-lucide="alert-circle"></i><span>SOS</span></a>
            <a href="/user/relief" class="nav-item"><i data-lucide="heart"></i><span>Relief</span></a>
            <a href="/user/profile" class="nav-item"><i data-lucide="user"></i><span>Profile</span></a>
        </nav>

        <main class="feed-area">
            <div class="feed-content">
                <div class="feed-header">
                    <h2 class="page-title">Community Feed</h2>
                </div>

                <div class="input-card">
                    <div class="post-input-wrapper" id="post-collapsed">
                        <input type="text" id="post-input-simple" placeholder="Share your thoughts anonymously..." readonly>
                        <button class="post-submit-btn" id="open-composer">Post</button>
                    </div>

                    <div class="post-composer" id="post-expanded" style="display:none;">
                        <div class="post-tabs">
                            <button class="tab-btn active" data-type="struggle">Struggle Post</button>
                            <button class="tab-btn" data-type="success">Success Story</button>
                        </div>

                        <textarea id="post-textarea"
                            class="post-textarea"
                            placeholder="Share what you're going through... You're not alone."></textarea>

                        <div class="post-actions">
                            <div class="left-actions">
                                <button type="button" class="media-upload" id="open-gif-search">
                                    <i data-lucide="image"></i>
                                    <span>Add GIF</span>
                                </button>
                            </div>
                            <div class="right-actions">
                                <button class="cancel-btn" id="cancel-post">Cancel</button>
                                <button id="post-button" class="post-submit-btn">Post</button>
                            </div>
                        </div>

                        <div class="gif-panel" id="gif-panel" style="display:none;">
                            <div class="gif-search-row">
                                <input id="gif-search-input" type="text" placeholder="Search Giphy for a supportive GIF">
                                <button id="gif-search-btn" type="button">Search</button>
                                <button id="gif-clear-btn" type="button">Clear</button>
                            </div>
                            <div id="selected-gif" class="selected-gif"></div>
                            <div id="gif-results" class="gif-results"></div>
                        </div>
                    </div>
                </div>

                <div id="post-container" class="post-list"></div>
            </div>
        </main>
    </div>

    <button class="help-fab"><i data-lucide="help-circle"></i></button>

    <div id="reportModal" class="report-modal-overlay" style="display: none;">
        <div class="report-modal-box">
            
            <div class="report-modal-header">
                <h3><i data-lucide="alert-triangle"></i> Report Post</h3>
                <button class="report-modal-close" onclick="closeReportModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <div class="report-modal-body">
                <p class="report-modal-question">Why are you reporting this post?</p>
                
                <div class="report-reasons">
                    <label class="report-reason-option">
                        <input type="radio" name="reportReason" value="Spam">
                        <div class="reason-label"><i data-lucide="alert-octagon"></i> Spam or misleading</div>
                    </label>
                    
                    <label class="report-reason-option">
                        <input type="radio" name="reportReason" value="Harassment">
                        <div class="reason-label"><i data-lucide="shield-alert"></i> Harassment or bullying</div>
                    </label>
                    
                    <label class="report-reason-option">
                        <input type="radio" name="reportReason" value="Inappropriate Content">
                        <div class="reason-label"><i data-lucide="eye-off"></i> Inappropriate or offensive content</div>
                    </label>
                    
                    <label class="report-reason-option">
                        <input type="radio" name="reportReason" value="Self-Harm">
                        <div class="reason-label"><i data-lucide="heart-crack"></i> Self-harm or suicide</div>
                    </label>
                    
                    <label class="report-reason-option">
                        <input type="radio" name="reportReason" value="Other">
                        <div class="reason-label"><i data-lucide="help-circle"></i> Other (please specify)</div>
                    </label>
                </div>

                <div class="report-additional">
                    <label for="reportCustomReason">Additional details (optional)</label>
                    <textarea id="reportCustomReason" placeholder="Please provide more context..."></textarea>
                </div>
            </div>

            <div class="report-modal-footer">
                <button class="btn-report-cancel" onclick="closeReportModal()">Cancel</button>
                <button class="btn-report-submit" onclick="submitReport()">
                    <i data-lucide="flag"></i> Submit Report
                </button>
            </div>
            
        </div>
    </div>

    <script src="community-feeds.js"></script>
    <script src="/user/user-shared.js"></script>
    <script src="mobileFixes.js"></script>
</body>
</html>
