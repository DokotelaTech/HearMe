<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - HearMe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 32px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
        }

        h1 {
            font-size: 1.6rem;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .appointment-info {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
        }

        .appointment-info p {
            margin-bottom: 6px;
            color: #374151;
            font-size: 0.92rem;
        }

        .appointment-info strong {
            color: #111827;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(124, 58, 237, 0.3);
        }

        .loading {
            color: #9ca3af;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="success-icon">✓</div>

        <h1>Payment Successful</h1>

        <p class="subtitle">
            Your session has been booked successfully.  
            The therapist will confirm your appointment shortly.
        </p>

        <div class="appointment-info" id="appointment-info">
            <p class="loading">Loading booking details...</p>
        </div>

        <a href="/user/profile" class="btn">View My Sessions</a>

    </div>

    <!-- 🎉 Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
        // 🎉 Confetti burst function
        function fireConfetti() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    spread: 120,
                    origin: { y: 0.6 }
                });
            }, 400);
        }

        // Trigger confetti on load
        window.addEventListener("load", fireConfetti);

        const params = new URLSearchParams(window.location.search);
        const appointmentId = params.get('appointmentId');
        const token = localStorage.getItem('token');

        if (appointmentId && token) {
            fetch(`/api/payments/confirm/${appointmentId}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(res => res.json())
            .then(data => {
                const a = data.appointment;

                if (a) {
                    document.getElementById('appointment-info').innerHTML = `
                        <p><strong>Therapist:</strong> ${a.therapistName}</p>
                        <p><strong>Date:</strong> ${a.date}</p>
                        <p><strong>Time:</strong> ${a.time}</p>
                        <p><strong>Type:</strong> ${a.type}</p>
                    `;
                } else {
                    document.getElementById('appointment-info').innerHTML =
                        `<p class="loading">No appointment details found.</p>`;
                }
            })
            .catch(() => {
                document.getElementById('appointment-info').innerHTML =
                    `<p class="loading">Failed to load booking details.</p>`;
            });
        }
    </script>

</body>
</html>
