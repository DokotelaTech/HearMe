<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearMe | Profile</title>
    <link rel="stylesheet" href="/user/profile.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <h1 class="logo">HearMe</h1>
        <div class="user-profile-section">
            </a>
            <div class="user-dropdown-container">
                <div class="user-profile-trigger" id="dropdownTrigger">
                    <div class="user-badge">User</div>
                    <div class="user-avatar">U</div>
                </div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="/user/profile" class="dropdown-item">
                        <i data-lucide="user"></i>
                        <span>My Profile</span>
                    </a>
                    <hr class="dropdown-divider">
                    <a href="#" class="dropdown-item logout-item" id="logout-btn">
                        <i data-lucide="log-out"></i>
                        <span>Log Out</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <nav class="sidebar">
            <a href="/user/community" class="nav-item"><i data-lucide="home"></i><span>Feed</span></a>
            <a href="/user/groups" class="nav-item"><i data-lucide="users"></i><span>Groups</span></a>
            <a href="/user/chat" class="nav-item"><i data-lucide="message-square"></i><span>AI Chat</span></a>
            <a href="/user/experts" class="nav-item"><i data-lucide="user-plus"></i><span>Experts</span></a>
            <a href="/user/sos" class="nav-item"><i data-lucide="alert-circle"></i><span>SOS</span></a>
            <a href="/user/relief" class="nav-item"><i data-lucide="heart"></i><span>Relief</span></a>
            <a href="/user/profile" class="nav-item active"><i data-lucide="user"></i><span>Profile</span></a>
        </nav>

        <main class="profile-area">

            <div class="user-banner">
                <div class="user-info">
                    <div class="large-avatar" id="large-avatar">U</div>
                    <div class="user-details">
                        <h3 id="profile-name">Loading...</h3>
                        <p id="profile-since">Member since...</p>
                    </div>
                </div>
                <div class="user-stats">
                    <div class="stat-box">
                        <div class="stat-num" id="stat-days">0</div>
                        <div class="stat-label">Days Active</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="stat-posts">0</div>
                        <div class="stat-label">Posts Shared</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="stat-groups">0</div>
                        <div class="stat-label">Groups Joined</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-num" id="stat-sessions">0</div>
                        <div class="stat-label">Sessions Done</div>
                    </div>
                </div>
            </div>

            <div class="profile-grid">
                <div class="card roadmap-card">
                    <div class="card-header">
                        <h3>Your Healing Roadmap</h3>
                        <div class="progress-info">
                            <i data-lucide="trending-up" class="purple-icon"></i>
                            <span id="progress-text">0% Complete</span>
                        </div>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-bar" style="width: 0%;"></div>
                    </div>
                    <div class="task-list" id="roadmap-task-list"></div>
                </div>

                <div class="right-column">
                    <div class="card side-card">
                        <div class="card-header">
                            <h3>
                                <i data-lucide="calendar" class="purple-icon"></i>
                                Upcoming Sessions
                            </h3>
                        </div>
                        <div id="dynamic-events" class="dynamic-container">
                            <p class="empty-state">No upcoming sessions</p>
                        </div>
                    </div>

                    <div class="card side-card">
                        <div class="card-header">
                            <h3>
                                <i data-lucide="award" class="gold-icon"></i>
                                Achievements
                            </h3>
                        </div>
                        <div id="dynamic-achievements" class="dynamic-container"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

            <!-- VIDEO MODAL -->
        <div class="modal-overlay" id="video-modal-overlay"></div>
        <div class="video-modal" id="video-modal">
            <div class="video-modal-header">
                <h3 id="video-modal-title">Session in Progress</h3>
                <button class="close-btn" id="close-video-modal">✕ End Session</button>
            </div>
            <div class="video-modal-body">
                <iframe id="daily-iframe"
                    allow="camera; microphone; fullscreen; display-capture"
                    style="width:100%; height:100%; border:none; border-radius:8px;">
                </iframe>
            </div>
        </div>

    <script src="/user/profile.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
