<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearMe | Profile</title>
    <link rel="stylesheet" href="profile.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <h1 class="logo">HearMe</h1>
        <div class="user-profile-section">

            <a href="messages.html" class="msg-icon-btn" title="Messages">
                <i data-lucide="message-square"></i>
                <span class="msg-badge"></span> </a>

            <div class="user-dropdown-container">
                <div class="user-profile-trigger" id="dropdownTrigger">
                    <div class="user-badge">
                        User
                    </div>
                    <div class="user-avatar">
                        U
                    </div>
                </div>

                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html" class="dropdown-item">
                        <i data-lucide="user"></i>
                        <span>My Profile</span>
                    </a>
                    <hr class="dropdown-divider">
                    <a href="logout.html" class="dropdown-item logout-item">
                        <i data-lucide="log-out"></i>
                        <span>Log Out</span>
                    </a>
                </div>
            </div>

        </div>
    </header>

    <div class="app-container">

        <nav class="sidebar">
            <a href="community-feeds.html" class="nav-item">
                <i data-lucide="home"></i>
                <span>Feed</span>
            </a>

            <a href="groups.html" class="nav-item">
                <i data-lucide="users"></i>
                <span>Groups</span>
            </a>

            <a href="ai-chat.html" class="nav-item">
                <i data-lucide="message-square"></i>
                <span>AI Chat</span>
            </a>

            <a href="experts.html" class="nav-item">
                <i data-lucide="user-plus"></i>
                <span>Experts</span>
            </a>

            <a href="SOS.html" class="nav-item">
                <i data-lucide="alert-circle"></i>
                <span>SOS</span>
            </a>

            <a href="relief.html" class="nav-item">
                <i data-lucide="heart"></i>
                <span>Relief</span>
            </a>

            <a href="profile.html" class="nav-item active">
                <i data-lucide="user"></i>
                <span>Profile</span>
            </a>
        </nav>

        <main class="profile-area">

            <div class="user-banner">
                <div class="user-info">
                    <div class="large-avatar">A</div>
                    <div class="user-details">
                        <h3>Anonymous User #8472</h3>
                        <p>Member since March 2026</p>
                    </div>
                </div>

                <div class="user-stats">
                    <div class="stat-box">
                        <div class="stat-num" id="stat-days">0</div>
                        <div class="stat-label">Days Active</div>
                    </div>

                    <div class="stat-box">
                        <div class="stat-num" id="stat-posts">0</div>
                        <div class="stat-label">Posts Shared</div>
                    </div>

                    <div class="stat-box">
                        <div class="stat-num" id="stat-groups">0</div>
                        <div class="stat-label">Groups Joined</div>
                    </div>

                    <div class="stat-box">
                        <div class="stat-num" id="stat-sessions">0</div>
                        <div class="stat-label">Sessions Done</div>
                    </div>
                </div>
            </div>

            <div class="profile-grid">

                <div class="card roadmap-card">
                    <div class="card-header">
                        <h3>Your Healing Roadmap</h3>
                        <div class="progress-info">
                            <i data-lucide="trending-up" class="purple-icon"></i>
                            <span id="progress-text">40% Complete</span>
                        </div>
                    </div>

                    <div class="progress-track">
                        <div class="progress-fill" id="progress-bar" style="width: 40%;"></div>
                    </div>

                    <div class="task-list" id="roadmap-task-list"></div>
                </div>

                <div class="right-column">

                    <div class="card side-card">
                        <div class="card-header">
                            <h3>
                                <i data-lucide="calendar" class="purple-icon"></i>
                                Upcoming Events
                            </h3>
                        </div>
                        <div id="dynamic-events" class="dynamic-container"></div>
                    </div>

                    <div class="card side-card">
                        <div class="card-header">
                            <h3>
                                <i data-lucide="award" class="gold-icon"></i>
                                Achievements
                            </h3>
                        </div>
                        <div id="dynamic-achievements" class="dynamic-container"></div>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <script src="profile.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
