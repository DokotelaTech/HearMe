<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session - HearMe</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; }
        .booking-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; margin-bottom: 30px; }
        .time-slot { padding: 12px; border: 1px solid #ccc; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .time-slot:hover { background-color: #f0f0f0; }
        .time-slot.selected { background-color: #c91871; color: white; border-color: #c91871; font-weight: bold; } /* HearMe Pink */
        .confirm-btn { display: none; width: 100%; padding: 15px; background-color: #c91871; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px;}
        .confirm-btn:hover { background-color: #a01058; }
    </style>
</head>
<body>

    <div class="booking-container">
        <h2 id="expert-name-title">Book a Session</h2>
        <p>Select an available time slot below:</p>

        <div id="availability-container">
            <p id="loading-text">Loading availability...</p>
        </div>

        <button id="confirm-booking-btn" class="confirm-btn">Confirm Appointment</button>
    </div>

    <script src="booking.js"></script>
</body>
</html>
