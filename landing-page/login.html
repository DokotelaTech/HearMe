<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>HearMe - Welcome Back</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Logo moved outside the card to the top-left of the screen -->
    <div class="pageLogoContainer">
        <!-- <img src="hearme-logo.png" alt="HearMe Logo" class="pageLogo"> -->
    </div>

    <div class="mainContainer">
        <div class="loginCard">
            
            <!-- Left Side: HearMe Gradient with Abstract Shapes -->
            <div class="leftSide">
                
                <!-- Decorative Elements -->
                <div class="decorDots decorDotsTop"></div>
                <div class="decorDots decorDotsBottom"></div>
                <div class="decorPill decorPillOne"></div>
                <div class="decorPill decorPillTwo"></div>
                <div class="decorCircleRing"></div>
                <div class="decorCircleSolid"></div>
                <div class="decorCross decorCrossOne"><i class="fa-solid fa-plus"></i></div>
                <div class="decorCross decorCrossTwo"><i class="fa-solid fa-plus"></i></div>

                <!-- Left Content -->
                <div class="leftContent">
                    <h1>Your safe<br>space starts<br>here</h1>
                    <p>Log in to continue your healing journey, connect anonymously, and find the support you deserve.</p>
                </div>
            </div>

            <!-- Right Side: Clean Form Area with HearMe Text -->
            <div class="rightSide">
                
                <div class="formWrapper">
                    
                    <div class="logoContainer">
                        <div class="logoBox">
                            <i class="fa-solid fa-leaf"></i>
                        </div>
                    </div>

                    <div class="formHeader">
                        <span class="brandText">HearMe</span>
                        <h2>Hello! Welcome back</h2>
                    </div>

                    <form id="loginForm">
                        
                        <div class="inputContainer">
                            <label>Email Address</label>
                            <div class="inputWrapper">
                                <i class="fa-regular fa-envelope"></i>
                                <input id="email" type="email" placeholder="Enter your email address" required>
                            </div>
                        </div>

                        <div class="inputContainer">
                            <label>Password</label>
                            <div class="inputWrapper">
                                <i class="fa-solid fa-lock"></i>
                                <input id="password" type="password" placeholder="••••••••••••" required>
                            </div>
                        </div>

                        <div class="actionRow">
                            <label class="rememberMe">
                                <input type="checkbox"> Remember me
                            </label>
                            <a href="#" class="resetLink">Reset Password!</a>
                        </div>

                        <button type="submit" class="submitBtn">Login</button>

                        <div class="divider">
                            <span>or</span>
                        </div>

                        <div class="socialLoginContainer">
                            <button type="button" class="socialBtn">
                                <i class="fa-brands fa-google" style="color: #ea4335;"></i>
                            </button>
                            <button type="button" class="socialBtn">
                                <i class="fa-brands fa-facebook-f" style="color: #1877f2;"></i>
                            </button>
                            <button type="button" class="socialBtn">
                                <i class="fa-brands fa-apple" style="color: #000000;"></i>
                            </button>
                        </div>

                        <p class="footerText">
                            Don't have an account? <a href="/signup">Create Account</a>
                        </p>

                    </form>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
