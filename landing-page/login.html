<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearMe - Welcome Back</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="brand-header">
        <h1>HearMe</h1>
        <p>Your safe space for healing</p>
    </div>

    <div class="container">
        <div class="form-box">
            <h2>Welcome Back</h2>

            <form id="login-form">
                <p class="label-text">I am a:</p>
                <div class="role-selector">
                    <div class="role-option active" data-role="user">
                        <i class="fa-regular fa-user"></i>
                        <span>User</span>
                    </div>
                    <a href="therapist-login.html" class="role-option" data-role="therapist">
                        <i class="fa-solid fa-user-doctor"></i>
                        <span>Therapist</span>
                    </a>
                    <a href="admin-login.html" class="role-option" data-role="admin">
                        <i class="fa-solid fa-shield"></i>
                        <span>Admin</span>
                    </a>
                </div>

                <div class="anon-toggle">
                    <input type="checkbox" id="anonymous" checked>
                    <label for="anonymous">Keep me completely anonymous (recommended)</label>
                </div>

                <div class="input-field">
                    <div class="input-group">
                        <input id="identifier" name="identifier" type="text" placeholder="Enter your email or username" required>
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <div class="input-field">
                    <div class="input-group">
                        <input id="password" name="password" type="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" id="Btn">Sign In</button>

                <p class="footer-text">
                    Don't have an account?<a href="signup.html">Sign up</a>
                </p>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
