<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>

    <link rel="stylesheet" href="otp.css">
</head>
<body>

    <div class="otp-container">

        <div class="otp-card">

            <h1>OTP Verification</h1>

            <p>
                Enter the OTP code sent to your email and phone number
            </p>

            <input 
                type="text" 
                id="otpInput"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
            >

            <button id="verifyBtn">
                Verify OTP
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script src="otp.js"></script>

</body>
</html>
