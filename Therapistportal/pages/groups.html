<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearMe - Groups</title>
    <!-- Assuming your existing styles are linked here -->
    <link rel="stylesheet" href="/therapist/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 5000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #fff; padding: 24px; border-radius: 12px; width: 400px; }
        
        /* Layout Fixes */
        .groups-main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .btn-trigger { background: #2563eb; color: white; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar restored to match image_92922f.png -->
        <aside class="sidebar">
            <div class="brand-area">
                <span class="logo">HearMe</span>
                <span class="badge">Therapist Portal</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item"><i class="fa-solid fa-user-group"></i> My Clients</a>
                <a href="#" class="nav-item"><i class="fa-regular fa-calendar"></i> Calendar</a>
                <a href="#" class="nav-item"><i class="fa-regular fa-message"></i> Messages</a>
                <a href="#" class="nav-item active"><i class="fa-solid fa-people-group"></i> Groups</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i> Stress Relief Uploads</a>
                <a href="#" class="nav-item"><i class="fa-solid fa-triangle-exclamation"></i> Report Issue</a>
            </nav>
            <div class="overview-box">
                <h4>Today's Overview</h4>
                <div class="ov-line">Active Clients <span>0</span></div>
                <div class="ov-line">Sessions Today <span>0</span></div>
                <div class="ov-line">Unread Messages <span>0</span></div>
            </div>
        </aside>

        <main class="main-workspace">
            <div class="content-container">
                <div class="page-header">
                    <h1>Groups</h1>
                    <div>
                        <button class="btn-trigger" onclick="document.getElementById('createModal').classList.add('show')">Create Group</button>
                        <button class="btn-trigger" onclick="document.getElementById('eventModal').classList.add('show')">Schedule Event</button>
                    </div>
                </div>

                <!-- Reorganized Grid: Groups on Left, Chat on Right -->
                <div class="groups-main-grid">
                    <section class="card">
                        <h3>Your Groups</h3>
                        <div id="therapistGroupsList"></div>
                    </section>
                    
                    <section class="card">
                        <h3>Group Chat <span class="therapist-badge">Therapist</span></h3>
                        <div id="therapistGroupMessages"></div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals with original form inputs -->
    <div id="createModal" class="modal-overlay" onclick="this.classList.remove('show')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Create Group</h3>
            <form id="createGroupForm">
                <label>Group name</label>
                <input type="text" placeholder="Anxiety Support Circle" required>
                <label>Category</label>
                <input type="text" placeholder="Anxiety & Stress" required>
                <label>Meeting time</label>
                <input type="text" placeholder="Wednesdays at 18:00">
                <label>Description</label>
                <textarea placeholder="Describe who this group supports"></textarea>
                <button type="submit">Create Group</button>
            </form>
        </div>
    </div>

    <div id="eventModal" class="modal-overlay" onclick="this.classList.remove('show')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Schedule Group Event</h3>
            <form id="groupEventForm">
                <label>Event title</label>
                <input type="text" placeholder="Guided grounding session" required>
                <label>Date</label>
                <input type="date" required>
                <label>Time</label>
                <input type="time" required>
                <label>Notes</label>
                <textarea placeholder="What members should prepare"></textarea>
                <button type="submit">Schedule Event</button>
            </form>
        </div>
    </div>

</body>
</html>
