<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HearMe - Groups</title>
    <link rel="stylesheet" href="/therapist/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --primary: #0d9488; --primary-light: #ccfbf1; --secondary: #2563eb; }
        html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 5000; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #fff; padding: 24px; border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .close-modal { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 24px; cursor: pointer; color: #6b7280; }
        
        /* Layout Improvements */
        .btn-action { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-action:hover { background: #0f766e; }
        .mobile-topbar { display: none; position: sticky; top: 0; z-index: 3000; height: 60px; background: #ffffff; border-bottom: 1px solid #e2e8f0; align-items: center; justify-content: space-between; padding: 0 16px; width: 100%; box-sizing: border-box; }
        
        /* Mobile Specifics */
        @media (max-width: 768px) {
            .mobile-topbar { display: flex; }
            .topbar { display: none !important; }
            .app-layout { display: block !important; }
            .sidebar { position: fixed !important; top: 60px !important; left: -280px !important; width: 260px !important; height: calc(100vh - 60px) !important; z-index: 2500 !important; background: #fff !important; transition: left 0.3s ease; }
            .sidebar.show { left: 0 !important; }
            .main-workspace { margin-left: 0 !important; width: 100% !important; }
            .therapist-group-tools { grid-template-columns: 1fr !important; }
            .btn-action { width: 100%; margin-bottom: 10px; }
        }

        /* Chat Window Space */
        #therapistGroupMessages { height: 450px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; background: #f9fafb; }
    </style>
</head>
<body>

    <header class="mobile-topbar">
        <button class="hamburger-btn" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
        <span class="mobile-brand">HearMe</span>
    </header>
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="brand-area"><span class="logo">HearMe</span></div>
            <nav class="nav-menu">
                <a href="/therapist/clients" class="nav-item"><i class="fa-solid fa-user-group"></i> My Clients</a>
                <a href="/therapist/calendar" class="nav-item"><i class="fa-regular fa-calendar"></i> Calendar</a>
                <a href="/therapist/groups" class="nav-item active"><i class="fa-solid fa-people-group"></i> Groups</a>
            </nav>
        </aside>

        <main class="main-workspace">
            <div class="content-container">
                <div class="page-header">
                    <h1>Groups</h1>
                    <div class="actions">
                        <button class="btn-action" onclick="document.getElementById('createModal').classList.add('show')">Create Group</button>
                        <button class="btn-action" style="background: var(--secondary);" onclick="document.getElementById('eventModal').classList.add('show')">Schedule Event</button>
                    </div>
                </div>

                <div id="createModal" class="modal-overlay">
                    <div class="modal-content">
                        <button class="close-modal" onclick="this.parentElement.parentElement.classList.remove('show')">&times;</button>
                        <h3>Create New Group</h3>
                        <form id="createGroupForm" class="group-form">
                            <input type="text" placeholder="Group Name" required style="width: 100%; margin-bottom: 10px; padding: 10px;">
                            <textarea placeholder="Description" style="width: 100%; margin-bottom: 10px; padding: 10px;"></textarea>
                            <button type="submit" class="btn-action">Create</button>
                        </form>
                    </div>
                </div>

                <div id="eventModal" class="modal-overlay">
                    <div class="modal-content">
                        <button class="close-modal" onclick="this.parentElement.parentElement.classList.remove('show')">&times;</button>
                        <h3>Schedule Group Event</h3>
                        <form id="groupEventForm" class="group-form">
                            <input type="text" placeholder="Event Title" required style="width: 100%; margin-bottom: 10px; padding: 10px;">
                            <input type="date" style="width: 100%; margin-bottom: 10px; padding: 10px;">
                            <button type="submit" class="btn-action">Schedule</button>
                        </form>
                    </div>
                </div>

                <div class="therapist-groups-layout">
                    <section class="card">
                        <h3>Your Groups</h3>
                        <div id="therapistGroupsList"></div>
                    </section>
                    <aside class="card">
                        <h3>Members</h3>
                        <div id="groupMembersList"></div>
                    </aside>
                </div>

                <section class="card">
                    <h3>Group Chat <span class="therapist-badge">Therapist</span></h3>
                    <div id="therapistGroupMessages"></div>
                    <div class="therapist-group-chat-input">
                        <input id="therapistGroupMessageInput" type="text" placeholder="Message the group...">
                        <button id="therapistSendGroupMessage">Send</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        // Hamburger & Modal Toggle Logic
        document.getElementById('hamburgerBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        });
    </script>
</body>
</html>
